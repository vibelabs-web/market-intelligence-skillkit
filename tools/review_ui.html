<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>결과물 검토</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--line:#dcdce2;--ink:#1c1c20;--mute:#6b6b75;--bg:#f5f5f7;--acc:#2f4fc4}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}header b{font-size:15px}
select,input,textarea,button{font:inherit}select,input{padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
button{padding:6px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.ok{background:#1f7a3f;color:#fff;border-color:#1f7a3f}button:disabled{opacity:.5;cursor:default}
main{flex:1;display:flex;min-height:0}#doc{flex:1;min-width:0;background:#fff}iframe{width:100%;height:100%;border:0;display:block}
aside{width:340px;background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:12px}aside h3{margin:14px 0 6px;font-size:13px;color:var(--mute)}
.fb{background:#fff;border:1px solid var(--line);border-left:4px solid #e6b800;border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}.fb.good{border-left-color:#2a8f4a}.fb q{display:block;color:var(--mute);font-size:12px;max-height:3.2em;overflow:hidden}.fb .x{float:right;border:0;background:none;padding:0 3px;color:#999}
#pop{position:fixed;display:none;width:320px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;z-index:9}#pop textarea{width:100%;height:68px;border:1px solid var(--line);border-radius:6px;padding:6px;margin:6px 0}#pop q{display:block;font-size:12px;color:var(--mute);max-height:3em;overflow:hidden}
#cmd{display:none;background:#10203f;color:#fff;border-radius:6px;padding:8px;font:12px ui-monospace,monospace;word-break:break-all;margin-top:6px}.hint{color:var(--mute);font-size:12px}.bar{display:flex;gap:6px;flex-wrap:wrap}#msg{color:#b00020;font-size:12px}
@media(max-width:800px){main{flex-direction:column}aside{width:100%;max-height:45%}}
</style></head><body>
<header><b>결과물 검토</b>
<label>실행 <select id="run"></select></label><label>파일 <select id="file"></select></label>
<label>비교 <select id="cmp"><option value="">이전 판과 비교 안 함</option></select></label>
<label>평가자 <input id="who" size="14" placeholder="이름"></label><span class="hint" id="state"></span></header>
<main><div id="doc"><iframe id="frame" sandbox="allow-same-origin allow-popups" title="결과물"></iframe></div>
<aside><details open style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px"><summary><b>이렇게 읽어 보세요</b></summary>
<div class="hint" style="margin-top:6px">받는 사람이 되어 읽고, 걸리는 문장을 드래그하세요.</div>
<ol style="margin:6px 0 0;padding-left:18px"><li>첫 문단만 읽고 무엇을 할지 알겠나요?</li><li>«그래서 어쩌라고?» 싶은 문장이 있나요?</li><li>이 사람이 몰라도 되는 내용이 있나요?</li><li>근거 번호를 눌러 문장과 원문이 맞는지 보세요.</li><li>이대로 보내면 어디서 망신을 당할까요?</li></ol></details>
<h3>AI 가 먼저 의심한 곳 <span id="sn"></span></h3><div id="sugg"></div>
<h3>피드백 <span id="n"></span></h3><div id="list"></div>
<h3>이 결과를 고객에게 보낼 수 있나요?</h3><textarea id="reason" rows="2" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px" placeholder="이유 한 줄"></textarea>
<div class="bar" style="margin-top:6px"><button id="no">아직 아님 — 다시 돌리기</button><button class="ok" id="yes">보낼 수 있음</button></div>
<div id="cmd"></div><div class="bar" style="margin-top:8px"><button class="pri" id="gold" disabled title="«보낼 수 있음» 판정 뒤에 저장할 수 있습니다. 개발자가 재현할 기준이 됩니다.">골든으로 저장</button></div><div class="hint">«보낼 수 있음»으로 판정하면 이 결과를 개발자가 재현할 기준으로 저장할 수 있습니다.</div><div id="msg"></div></aside></main>
<div id="evbox" style="position:fixed;display:none;right:360px;bottom:18px;width:430px;max-height:50vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px;z-index:8"></div>
<div id="pop"><q id="popq"></q><textarea id="popc" placeholder="무엇이 문제이고 어떻게 바뀌어야 하나요?"></textarea>
<div class="bar"><button class="pri" data-k="fix">고쳐야 함</button><button data-k="remove">빼야 함</button><button data-k="missing">더 있어야 함</button><button data-k="good">좋음 — 유지</button><button id="popx">닫기</button></div></div>
<script>
const $=s=>document.querySelector(s),frame=$('#frame');let cur=null,sel=null;
try{$('#who').value=localStorage.getItem('who')||''}catch(e){}
$('#who').onchange=()=>{try{localStorage.setItem('who',$('#who').value)}catch(e){}};
const j=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const d=await r.json();if(!r.ok)throw new Error(d.error||'오류');return d};
const say=m=>$('#msg').textContent=m||'';
async function loadRuns(pick){const {runs}=await j('/api/runs');const s=$('#run');s.innerHTML=runs.map(r=>`<option value="${r.run}">${r.run}${r.person?' · '+r.person:''}${r.golden?' ★':''}</option>`).join('');
 if(!runs.length){$('#state').textContent='아직 결과물이 없습니다';return}s.value=pick||new URLSearchParams(location.search).get('run')||runs[0].run;await loadRun()}
async function loadRun(){cur=await j('/api/run?run='+encodeURIComponent($('#run').value));
 $('#file').innerHTML=cur.files.map(f=>`<option>${f}</option>`).join('');
 $('#cmp').innerHTML='<option value="">이전 판과 비교 안 함</option>'+cur.lineage.slice(1).map(r=>`<option value="${r}">${r} 와 비교</option>`).join('');$('#cmp').parentNode.style.display=cur.lineage.length>1?'':'none';$('#yes').style.outline=cur.verdict?.ok?'3px solid #1f7a3f':'';$('#no').style.outline=cur.verdict&&!cur.verdict.ok?'3px solid #b00020':'';$('#evbox').style.display='none';
 $('#reason').value=cur.verdict?.reason||'';$('#gold').disabled=!cur.verdict?.ok;$('#cmd').style.display='none';$('#state').textContent=cur.verdict?(cur.verdict.ok?'판정: 보낼 수 있음':'판정: 아직 아님'):'판정 전';show();renderList();renderSugg()}
function show(){const f=$('#file').value,c=$('#cmp').value;if(!f)return;
 if(c){frame.src=`/diff?a=${encodeURIComponent(c)}&b=${encodeURIComponent(cur.run)}&file=${encodeURIComponent(f)}`;return}
 frame.src=`/doc?run=${encodeURIComponent(cur.run)}&file=${encodeURIComponent(f)}`}
function renderList(){const f=$('#file').value;$('#n').textContent='('+cur.feedback.length+')';
 const KIND={fix:'고쳐야 함',remove:'빼야 함',missing:'더 있어야 함',good:'유지'};
 $('#list').innerHTML=cur.feedback.map(x=>`<div class="fb ${x.kind==='good'?'good':''}" data-id="${x.id}"><button class="x" title="지우기" data-del="${x.id}">×</button><b>${KIND[x.kind]||x.kind}</b> ${x.file===f?'':'<span class=hint>'+esc(x.file)+'</span>'}<q>${esc(x.quote||'')}</q>${esc(x.comment||'')}</div>`).join('')||'<div class=hint>아직 없습니다.</div>';paint()}
function renderSugg(){const s=(cur.suggestions||[]).filter(x=>!x.state);$('#sn').textContent='('+s.length+')';
 $('#sugg').innerHTML=s.map(x=>`<div class="fb" style="border-left-color:#3b6fe0" data-sid="${x.id}"><q>${esc(x.quote||'')}</q>${esc(x.comment||'')}<div class="hint">${esc(x.who||'')}</div><div class="bar" style="margin-top:6px"><button data-acc="${x.id}">맞아요</button><button data-rej="${x.id}">아니에요</button></div></div>`).join('')||'<div class=hint>아직 AI 사전 검토가 없습니다.</div>'}
$('#sugg').addEventListener('click',async e=>{const id=e.target.dataset.acc||e.target.dataset.rej;if(!id){const c=e.target.closest('.fb');if(c){const x=cur.suggestions.find(i=>i.id===c.dataset.sid);if(x)locate(x)}return}
 try{await j('/api/suggestion',{run:cur.run,id,accept:!!e.target.dataset.acc,reviewer:$('#who').value});const r=await j('/api/run?run='+encodeURIComponent(cur.run));cur.feedback=r.feedback;cur.suggestions=r.suggestions;renderSugg();renderList();say('')}catch(err){say(err.message)}});
function locate(x){if(x.file!==$('#file').value){$('#file').value=x.file;show();return}const doc=frame.contentDocument;const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.nodeValue.includes((x.quote||'').slice(0,18))){n.parentElement.scrollIntoView({block:'center'});return}}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function textMap(doc){const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let t='',m=[],n;while(n=w.nextNode()){m.push([n,t.length]);t+=n.nodeValue}return{t,m}}
function clearMarks(doc){doc.querySelectorAll('mark.fb').forEach(e=>{e.replaceWith(...e.childNodes)});doc.body.normalize()}
function paint(){const doc=frame.contentDocument;if(!doc||!doc.body||$('#cmp').value)return;
 if(!doc.getElementById('fbcss')){const st=doc.createElement('style');st.id='fbcss';st.textContent='mark.fb{background:#ffe58a;cursor:pointer}mark.fb.good{background:#bdeec8}mark.fb.flash{outline:2px solid #2f4fc4}';doc.head.appendChild(st)}
 clearMarks(doc);const f=$('#file').value;for(const x of cur.feedback){if(x.file!==f||!x.quote)continue;const {t,m}=textMap(doc);let i=-1;for(let k=0;k<=(x.occurrence||0);k++){i=t.indexOf(x.quote,i+1);if(i<0)break}if(i<0)continue;
  const end=i+x.quote.length;for(const [n,o] of m){const a=Math.max(i,o),b=Math.min(end,o+n.nodeValue.length);if(a<b&&n.parentNode){const r=doc.createRange();r.setStart(n,a-o);r.setEnd(n,b-o);const mk=doc.createElement('mark');mk.className='fb'+(x.kind==='good'?' good':'');mk.dataset.id=x.id;try{r.surroundContents(mk)}catch(e){}}}}}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc||!doc.body)return;paint();
 doc.addEventListener('click',async ev=>{const a=ev.target.closest&&ev.target.closest('a.ev');if(!a)return;ev.preventDefault();const d=await j('/api/evidence?id='+encodeURIComponent(a.textContent.trim()));const b=$('#evbox');b.style.display='block';b.innerHTML=d.error?`<b>${esc(a.textContent)}</b><p>${esc(d.error)}</p><button onclick="this.parentNode.style.display='none'">닫기</button>`:`<b>${esc(d.evidence_id)}</b> · ${esc(d.status)} · 신뢰 ${esc(d.confidence||'')}<p>${esc(d.claim)}</p><blockquote style="margin:0;padding-left:10px;border-left:3px solid #bbb;color:#555">${esc(d.quote)}</blockquote><p class="hint">${esc(d.publisher)} · ${esc(d.source_title||'')} · 시점 ${esc(d.data_period||d.published_at||'')}<br>한계: ${esc(d.limitations||'없음')}</p><a href="${esc(d.source_url)}" target="_blank" rel="noopener">원문 열기 ↗</a> <button onclick="this.parentNode.style.display='none'">닫기</button>`});
 doc.addEventListener('mouseup',ev=>{if($('#cmp').value)return;const s=doc.getSelection();const q=s?s.toString().trim():'';if(q.length<2)return;
  const r=frame.getBoundingClientRect();const {t}=textMap(doc);let occ=0;const rg=s.getRangeAt(0);const pre=doc.createRange();pre.setStart(doc.body,0);pre.setEnd(rg.startContainer,rg.startOffset);const before=pre.toString();let i=-1;while((i=t.indexOf(q,i+1))>=0&&i<before.length-1)occ++;
  sel={quote:q,occurrence:occ};$('#popq').textContent=q;$('#popc').value='';const p=$('#pop');p.style.display='block';p.style.left=Math.max(8,Math.min(r.left+ev.clientX+8,r.right-330))+'px';p.style.top=Math.min(r.top+ev.clientY+8,innerHeight-210)+'px';$('#popc').focus()})});
document.querySelectorAll('#pop [data-k]').forEach(b=>b.onclick=async()=>{try{const it=await j('/api/feedback',{run:cur.run,file:$('#file').value,quote:sel.quote,occurrence:sel.occurrence,comment:$('#popc').value,kind:b.dataset.k,reviewer:$('#who').value});cur.feedback.push(it);$('#pop').style.display='none';say('');renderList()}catch(e){say(e.message)}});
$('#popx').onclick=()=>$('#pop').style.display='none';
$('#list').onclick=async e=>{const d=e.target.dataset.del;if(d){await j('/api/feedback/delete',{run:cur.run,id:d});cur.feedback=cur.feedback.filter(x=>x.id!==d);renderList();return}
 const c=e.target.closest('.fb');if(!c)return;const x=cur.feedback.find(i=>i.id===c.dataset.id);if(x&&x.file!==$('#file').value){$('#file').value=x.file;show()}const mk=frame.contentDocument?.querySelector(`mark[data-id="${c.dataset.id}"]`);if(mk){mk.scrollIntoView({block:'center'});mk.classList.add('flash');setTimeout(()=>mk.classList.remove('flash'),1200)}};
async function verdict(ok){try{cur.verdict=await j('/api/verdict',{run:cur.run,ok,reason:$('#reason').value,reviewer:$('#who').value});$('#gold').disabled=!ok;$('#state').textContent=ok?'판정: 보낼 수 있음':'판정: 아직 아님';const c=$('#cmd');if(ok){c.style.display='none'}else{c.style.display='block';const line='/mi-feedback '+cur.run;c.innerHTML='<div style="margin-bottom:4px">다음 단계 — 지적을 반영해 다시 돌립니다. 아래 문장을 Claude 창에 붙여 넣으세요.</div>'+line+' <button id="cpy" style="margin-left:6px">복사</button>';$('#cpy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(line)}$('#yes').style.outline=ok?'3px solid #1f7a3f':'';$('#no').style.outline=ok?'':'3px solid #b00020';say('')}catch(e){say(e.message)}}
$('#no').onclick=()=>verdict(false);$('#yes').onclick=()=>verdict(true);
$('#gold').onclick=async()=>{try{const g=await j('/api/golden',{run:cur.run});say('');$('#state').textContent='골든 저장: golden/'+g.golden;$('#gold').disabled=true;await loadRuns(cur.run)}catch(e){say(e.message)}};
$('#run').onchange=loadRun;$('#file').onchange=()=>{show();renderList()};$('#cmp').onchange=show;
loadRuns().catch(e=>say(e.message));
</script></body></html>
